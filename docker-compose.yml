version: '3.8'

services:
  # PostgreSQL database for Keycloak persistence
  postgres:
    image: postgres:15-alpine
    container_name: euid-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak with OpenID4VP provider
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: euid-keycloak
    environment:
      # Database configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      
      # Keycloak configuration
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      
      # Development settings (disable for production)
      KC_DEV_MODE: "false"
      KC_CACHE: local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Mock wallet endpoint for testing (optional)
  mock-wallet:
    build:
      context: ./examples/mock-wallet
      dockerfile: Dockerfile
    container_name: euid-mock-wallet
    ports:
      - "8081:80"
    profiles:
      - testing

networks:
  default:
    driver: bridge
